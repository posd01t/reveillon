<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Sans cette ligne, un téléphone rend la page dans un viewport virtuel de
     980 px puis dézoome : tout paraît minuscule et rien ne se réagence.
     L'aperçu d'artifact l'injectait tout seul ; GitHub Pages sert le fichier
     tel quel, donc elle doit être écrite ici. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>On part où ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style id="css">
:root{
  --ground:#F2EDE3; --surface:#FBF8F1; --surface-2:#E9E0CF; --line:#D0C4B0;
  --ink:#171310; --ink-2:#463D34; --ink-3:#796C5E;
  --accent:#B23A20; --forest:#2E5741; --gold:#8A5E12;
  --oui:#2F6B45; --bof:#8A5E12; --non:#877B6D;
  --shadow:0 1px 0 rgba(23,19,16,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#17130F; --surface:#211B15; --surface-2:#2C241B; --line:#3F3529;
    --ink:#F5EEE3; --ink-2:#BCAD9A; --ink-3:#8E8070;
    --accent:#F0805C; --forest:#8FBFA0; --gold:#E0BC74;
    --oui:#8ED3A4; --bof:#E0BC74; --non:#8E8376;
    --shadow:0 1px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#17130F; --surface:#211B15; --surface-2:#2C241B; --line:#3F3529;
  --ink:#F5EEE3; --ink-2:#BCAD9A; --ink-3:#8E8070;
  --accent:#F0805C; --forest:#8FBFA0; --gold:#E0BC74;
  --oui:#8ED3A4; --bof:#E0BC74; --non:#8E8376;
  --shadow:0 1px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px 140px}

header{padding:56px 0 30px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
h1{font-family:"Bricolage Grotesque",Arial,sans-serif;font-weight:800;
  font-size:clamp(2.3rem,6vw,3.7rem);line-height:.98;letter-spacing:-.025em;margin:0;
  text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.standfirst{font-size:1.1rem;color:var(--ink-2);max-width:62ch;margin:0}

.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:8px 0 0}
.brief div{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.brief dt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
.brief dd{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;
  font-size:1rem;font-variant-numeric:tabular-nums}
.brief dd small{display:block;font-family:"Source Serif 4",Georgia,serif;font-weight:400;
  font-size:.83rem;color:var(--ink-3);letter-spacing:0;margin-top:2px;line-height:1.3}
.dists dt b{font-weight:600;color:var(--ink-2)}
.hint{display:inline-block;margin-top:6px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.04em;color:var(--ink-3)}

h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.45rem;
  letter-spacing:-.015em;margin:0}
.section-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:11px;margin:56px 0 20px;border-bottom:2px solid var(--ink)}
.section-head .step{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
.section-head .count{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-left:auto}
.section-note{font-size:.95rem;color:var(--ink-2);margin:-6px 0 22px;max-width:64ch}

/* --- accueil : prénom + toggle --- */
.gate{background:var(--surface);border:1px solid var(--ink);padding:24px;
  display:flex;flex-direction:column;gap:18px;margin-top:8px}
.gate h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.15rem;margin:0;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rename{background:none;border:none;cursor:pointer;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px}
.rename:hover{color:var(--accent)}
.gate p{margin:0;color:var(--ink-2);font-size:.97rem}
.gate .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gate input[type=text]{flex:1 1 220px;background:var(--ground);color:var(--ink);
  border:1px solid var(--line);border-radius:2px;padding:11px 13px;
  font-family:"Source Serif 4",Georgia,serif;font-size:1rem}
.gate input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}

.toggle{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.toggle button{background:var(--surface);border:none;cursor:pointer;text-align:left;
  padding:15px 17px;display:flex;flex-direction:column;gap:4px;color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif}
.toggle button .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1rem}
.toggle button .d{font-size:.92rem;color:var(--ink-2);line-height:1.45}
.toggle button.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.toggle button.on .t{color:var(--accent)}
@media (min-width:620px){.toggle{grid-template-columns:1fr 1fr}}

/* --- fiches --- */
.houses{display:grid;gap:14px}
.house{background:var(--surface);border:1px solid var(--line);padding:20px 22px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 26px;align-items:start;
  box-shadow:var(--shadow)}
/* min-width:auto est la valeur par défaut d'un item de grille ou de flex : sans
   ces min-width:0, le carrousel de couchages impose sa largeur min-content
   (~1980 px) à toute la fiche et la page part en scroll horizontal. */
.house>*,.body,.block,.bedgroups,.bedgroup,.house .head{min-width:0}
.house.v-oui{border-color:var(--oui);border-left-width:3px}
.house.v-bof{border-color:var(--bof);border-left-width:3px}
.house.v-non{opacity:.62}
.house .head{display:flex;flex-direction:column;gap:4px}
.house h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.16rem;
  margin:0;line-height:1.2;letter-spacing:-.01em;display:flex;gap:9px;align-items:baseline}
.pin{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--accent);
  font-weight:600;flex:none;padding-top:2px}
.house h3 a{color:inherit;text-decoration:none;
  background-image:linear-gradient(var(--accent),var(--accent));background-size:100% 1px;
  background-repeat:no-repeat;background-position:0 100%;padding-bottom:1px}
.house h3 a:hover{color:var(--accent)}
.place{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.src{border:1px solid var(--line);padding:1px 6px;border-radius:2px;color:var(--ink-2);letter-spacing:.06em}
.src.gdc{border-color:var(--forest);color:var(--forest)}
.money{text-align:right;display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.total{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.45rem;
  font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.per{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.body{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.block{display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid var(--line)}
.block:first-child{padding-top:0;border-top:none}
.blabel{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
.blabel .step{color:var(--accent);font-weight:600}
.blabel .tally{letter-spacing:.04em;text-transform:none;font-size:11.5px;color:var(--ink-2)}
.blabel .tally b{color:var(--ink);font-weight:600}
.bld{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.02rem;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.bld.multi{color:var(--bof)}
.bld span{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:.94rem;color:var(--ink-2)}
.dists{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);flex-wrap:wrap}
.dists div{background:var(--ground);padding:9px 15px;display:flex;flex-direction:column;gap:1px;flex:1 1 110px}
.dists dt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3)}
.dists dd{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;
  font-size:.98rem;font-variant-numeric:tabular-nums}
.dists dd small{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10px;
  color:var(--ink-3);letter-spacing:.03em;margin-left:5px}
.train{margin:0;font-size:.93rem;color:var(--ink-2);border-left:2px solid var(--forest);padding-left:11px}
.train b{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--forest);display:block;margin-bottom:2px;font-weight:600}
.extra{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.03em;
  display:grid;grid-template-columns:auto 1fr;gap:9px;padding:8px 11px;border-radius:2px;
  background:var(--surface-2);line-height:1.5}
.extra .mark{font-weight:600}
.extra.yes .mark{color:var(--oui)} .extra.part .mark{color:var(--bof)}
.extra.none .mark{color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--surface-2);color:var(--ink-2)}
.tag.hot{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.tag.spa{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.pierre{font-size:.95rem;color:var(--ink-2);border-left:2px solid var(--gold);padding-left:11px}
.pierre b{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px;font-weight:600}

/* --- la famille d'Avignon en plus --- */
.plus4{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;
  margin-top:11px;padding:9px 12px;border-radius:2px;font-size:.93rem;line-height:1.45;
  background:var(--surface-2);color:var(--ink-2)}
.plus4 .mark{font-family:"IBM Plex Mono",monospace;font-weight:600;line-height:1.5}
.plus4 b{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:600;display:block;margin-bottom:2px}
.plus4 em{font-style:normal;color:var(--ink-3)}
.plus4.part{background:transparent;border:1.5px solid var(--gold);color:var(--ink)}
.plus4.part .mark,.plus4.part b{color:var(--gold)}
.plus4.no .mark{color:var(--ink-3)}

/* --- couchages --- */
.sleep-scroll{overflow-x:auto;margin:0 -22px;padding:2px 22px 6px;scroll-snap-type:x proximity}
.bedcards{display:flex;gap:10px;min-width:min-content}
.bedcard{flex:0 0 152px;scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;
  background:var(--ground);padding:13px 14px 14px;display:flex;flex-direction:column;gap:7px;min-height:118px}
.bedcard.adult{border-color:var(--forest)}
.bedcard .icons{display:flex;gap:5px;align-items:flex-end;color:var(--ink-2);min-height:26px}
.bedcard.adult .icons{color:var(--forest)}
.bedcard svg{display:block}
.bedcard .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.9rem;
  line-height:1.2;letter-spacing:-.005em}
.bedcard .bd{font-size:.85rem;color:var(--ink-2);line-height:1.35}
.bedcard .xtra{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-top:auto;padding-top:5px}
.bedcard.unknown{color:var(--ink-3)}
.bedcard.unknown .nm{color:var(--ink-2)}
.bedgroups{display:flex;flex-direction:column;gap:14px}
.bedgroup{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--bof);padding-left:13px}
.glabel{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.glabel .gname{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.97rem}
.glabel .gcount{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.glabel .gnote{font-size:.9rem;color:var(--ink-2);flex-basis:100%}
.bedgroup .sleep-scroll{margin:0 -22px 0 0;padding:2px 22px 6px 0}
.flag{font-size:.9rem;color:var(--ink-3);font-style:italic;border-left:2px solid var(--line);padding-left:10px}

/* --- vote --- */
.vote{grid-column:1/-1;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vrow .lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.vbtn{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.95rem;
  background:var(--surface);color:var(--ink-2);border:1.5px solid var(--line);
  padding:8px 16px;border-radius:2px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:background .12s,border-color .12s,color .12s}
.vbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.vbtn .fl{width:11px;height:11px;border-radius:2px;background:var(--line);flex:none}
.vbtn[data-v=oui] .fl{background:var(--oui)}
.vbtn[data-v=bof] .fl{background:var(--bof)}
.vbtn[data-v=non] .fl{background:var(--non)}
/* Sélectionné : pastille pleine — c'est le seul état qu'on doit repérer d'un coup d'œil. */
.vbtn.on{color:var(--ground)}
.vbtn.on .fl{background:var(--ground)}
.vbtn[data-v=oui].on{border-color:var(--oui);background:var(--oui)}
.vbtn[data-v=bof].on{border-color:var(--bof);background:var(--bof)}
.vbtn[data-v=non].on{border-color:var(--non);background:var(--non)}
.others{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  letter-spacing:.02em;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.others .who{color:var(--ink-3)}
.others b{font-weight:600}
.others .o{color:var(--oui)} .others .b{color:var(--bof)} .others .x{color:var(--non)}
.hidden-note{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  letter-spacing:.03em;font-style:normal}

/* --- classement --- */
.rank{display:flex;flex-direction:column;gap:8px}
.rankrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);padding:12px 14px;
  transition:transform .16s ease,box-shadow .12s,border-color .12s}
.rankrow .grip{color:var(--ink-3);cursor:grab;touch-action:none;padding:4px 2px;
  display:flex;align-items:center;margin:-4px -2px}
.rankrow .grip:hover{color:var(--accent)}
.rankrow.dragging{transition:none;cursor:grabbing;z-index:5;position:relative;
  border-color:var(--accent);box-shadow:0 8px 22px rgba(23,19,16,.18)}
.rankrow.dragging .grip{cursor:grabbing}
.rankrow.shifted{transition:transform .16s ease}
body.dragging-rank{user-select:none;-webkit-user-select:none}
.rankrow.oui{border-left:3px solid var(--oui)}
.rankrow.bof{border-left:3px solid var(--bof)}
.rankrow .pos{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem;
  color:var(--accent);font-variant-numeric:tabular-nums;min-width:26px}
.rankrow .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1rem;line-height:1.25}
.rankrow .sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  letter-spacing:.05em;text-transform:uppercase;display:block;margin-top:2px}
.rankrow .mv{display:flex;gap:5px}
.rankrow .mv button{background:var(--ground);border:1px solid var(--line);color:var(--ink-2);
  width:34px;height:34px;border-radius:2px;cursor:pointer;font-size:15px;line-height:1}
.rankrow .mv button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.rankrow .mv button:disabled{opacity:.3;cursor:default}
.rankhint{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;
  color:var(--ink-3);margin:-8px 0 14px}

/* --- verdict --- */
.verdict{display:flex;flex-direction:column;gap:16px}
#verdictzone{scroll-margin-top:20px;border-radius:3px}
#verdictzone.needs{outline:2px solid var(--accent);outline-offset:10px;
  animation:needs 1.1s ease-in-out 2}
@keyframes needs{50%{outline-offset:4px}}
.section-head .count.todo{color:var(--accent);font-weight:600}
.reasons{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;background:var(--ground);color:var(--ink-2);
  border:1px solid var(--line);padding:7px 13px;border-radius:2px;cursor:pointer}
.rbtn.on{border-color:var(--accent);color:var(--accent);background:var(--surface-2)}
textarea{width:100%;min-height:80px;resize:vertical;background:var(--ground);color:var(--ink);
  border:1px solid var(--line);border-radius:2px;padding:11px 13px;
  font-family:"Source Serif 4",Georgia,serif;font-size:.97rem;line-height:1.5}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea::placeholder{color:var(--ink-3);font-style:italic}

/* --- résultats --- */
.results{display:flex;flex-direction:column;gap:9px}
.rres{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--line);padding:11px 14px}
.rres .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.98rem}
.rres .sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  letter-spacing:.05em;display:block;margin-top:2px}
.bar{display:flex;height:9px;width:170px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.bar .o{background:var(--oui)} .bar .b{background:var(--bof)} .bar .x{background:var(--non)}
.rres .num{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  white-space:nowrap;font-variant-numeric:tabular-nums}

.savebar{position:sticky;bottom:0;z-index:20;margin-top:36px;background:var(--surface);
  border:1px solid var(--ink);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 18px;box-shadow:0 -3px 14px rgba(0,0,0,.09)}
.savebar .status{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);
  letter-spacing:.03em;flex:1;min-width:170px}
.savebar .status b{color:var(--ink);font-variant-numeric:tabular-nums}
button.primary{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.95rem;
  background:var(--ink);color:var(--ground);border:1px solid var(--ink);padding:9px 18px;
  border-radius:2px;cursor:pointer}
button.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:disabled{opacity:.4;cursor:default}
button.ghost{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.95rem;
  background:none;color:var(--ink);border:1px solid var(--line);padding:9px 16px;
  border-radius:2px;cursor:pointer}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}

dialog{border:1px solid var(--ink);background:var(--surface);color:var(--ink);
  max-width:620px;width:92%;padding:22px;border-radius:2px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h4{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;margin:0 0 4px;font-size:1.1rem}
dialog p{margin:0 0 12px;font-size:.93rem;color:var(--ink-2)}
dialog textarea{height:260px;font-family:"IBM Plex Mono",monospace;font-size:12px}
dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;line-height:1.7}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){
  .house{grid-template-columns:minmax(0,1fr);padding:16px 16px}
  .money{text-align:left;flex-direction:row;align-items:baseline;gap:10px}
  header{padding-top:36px}
  .bar{width:110px}
  .wrap{padding:0 16px 120px}
  .sleep-scroll{margin:0 -16px;padding:2px 16px 6px}
  .bedgroup .sleep-scroll{margin:0 -16px 0 0;padding:2px 16px 6px 0}
  .brief{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  h1{font-size:clamp(2rem,9vw,2.6rem)}
  .vrow{gap:6px}
  .vbtn{flex:1 1 auto;justify-content:center;padding:11px 10px;font-size:.92rem}
  /* Les flèches restent sur la ligne, empilées : sur 17 maisons, une ligne
     qui passe de 56 à 110 px de haut transforme l'étape 2 en tunnel. */
  .rankrow{gap:9px;padding:10px 11px}
  .rankrow .mv{flex-direction:column;gap:4px}
  .rankrow .mv button{width:32px;height:27px;font-size:13px}
  .rankrow .pos{min-width:18px;font-size:1.05rem}
  .rankrow .nm{font-size:.95rem}
  .rankrow .sub{font-size:10px;letter-spacing:.03em}
  /* Le libellé du repère prend toute la largeur au lieu d'étrangler le texte. */
  .extra{grid-template-columns:1fr;gap:4px}
  .dists div{flex:1 1 0;min-width:0;padding:8px 9px}
  .dists dd small{display:block;margin-left:0;margin-top:1px}
  .section-head{margin:40px 0 18px}
  .gate{padding:18px 16px}
}
/* Le bandeau d'envoi collé en bas ne doit pas passer sous la barre du navigateur. */
@supports(padding:max(0px)){
  .bar-wrap,footer{padding-bottom:max(0px,env(safe-area-inset-bottom))}
}

function sleepHTML(h){

  rooms.forEach(function(r){
    var g=r.g||'', slot=groups.filter(function(x){return x.g===g})[0];
    if(!slot){slot={g:g,items:[]};groups.push(slot)}

  });
  var cards='';
  if(!rooms.length){
    cards='<div class="sleep-scroll"><div class="bedcards"><div class="bedcard unknown"><div class="icons">'+ICON.d+'</div>'
      +'<div class="nm">Non publié</div><div class="bd">L\'annonce ne détaille pas les chambres</div></div></div></div>';

/* ---------------- étape 2 : classement ---------------- */
function keptIds(){
  var v=myVotes(), ids=HOUSES.filter(function(h){return v[h.id]==='oui'||v[h.id]==='bof'}).map(function(h){return h.id});
  var saved=(myV().rank||[]).filter(function(id){return ids.indexOf(id)>-1});
  ids.forEach(function(id){ if(saved.indexOf(id)===-1) saved.push(id); });
  /* Les Oui d'abord, les Bof ensuite, et à l'intérieur de chaque bloc l'ordre
     que la personne a choisi. On fige les positions AVANT de trier : indexOf
     sur le tableau en cours de tri renvoie des positions déjà déplacées. */
  var pos={}; saved.forEach(function(id,i){ pos[id]=i; });
  saved.sort(function(a,b){
    var wa=v[a]==='oui'?0:1, wb=v[b]==='oui'?0:1;
    if(wa!==wb) return wa-wb;
    return pos[a]-pos[b];
  });
  return saved;
}

      +'<i class="o" style="width:'+(r.o/tot*100)+'%"></i><i class="b" style="width:'+(r.b/tot*100)+'%"></i><i class="x" style="width:'+(r.x/tot*100)+'%"></i>'
      +'</span><span class="num">'+r.o+' / '+r.b+' / '+r.x+'</span></span></div>';
  }).join('')+'</div>'
  +'<p class="section-note" style="margin-top:14px">Lecture : nombre de « Oui ! » / « Bof » / « Non ». '+voters.length+' personne'+(voters.length>1?'s ont':' a')+' voté : '+esc(voters.join(', '))+'.</p>';
}

/* ---------------- page ---------------- */
function renderBody(){
  var s='<div class="wrap">';
  s+='<header><div class="eyebrow">30 décembre 2026 → 2 janvier 2027 · 3 nuits</div>'
    +'<h1>On part <em>où</em> ?</h1>'
    +'<p class="standfirst">Six maisons disponibles sur les dates exactes, toutes au budget, toutes vérifiées une par une. Il n\'y a plus qu\'à dire ce que tu en penses — ça prend 5 minutes, sur le canapé, à la pause dej, ou même sur le pot.</p>'
    +'<dl class="brief">'
    +'<div><dt>Dates</dt><dd>30 déc → 2 jan</dd></div>'
    +'<div><dt>Le groupe</dt><dd>9 adultes · 6 enfants · 1 bébé</dd></div>'
    +'<div><dt>Budget</dt><dd>4 000 – 4 400 €<small>~150 €/adulte/nuit, tolérance 10 %</small></dd></div>'
    +'<div><dt>Maisons</dt><dd>6 à départager</dd></div>'
    +'</dl></header>';

  if(!me){
    s+='<div class="gate"><h3>D\'abord, t\'es qui ?</h3>'
      +'<p>Ton prénom sert juste à séparer ton vote de celui des autres. Il reste entre nous.</p>'
      +'<div class="row"><input type="text" id="nom" placeholder="Ton prénom" autocomplete="given-name" maxlength="24">'
      +'<button type="button" class="primary" id="go">C\'est parti</button></div></div>';
    s+='</div>';
    return s;
  }

  s+='<div class="gate"><h3>Bonjour '+esc(me)+' <button type="button" class="rename" id="rename">ce n\'est pas toi ?</button></h3>'
    +'<p>Tu peux voir les votes des autres au fil de l\'eau, ou faire ton tour dans ton coin et ne les découvrir qu\'à la fin. Ça se change à tout moment.</p>'
    +'<div class="toggle">'
    +'<button type="button" class="'+(showOthers?'on':'')+'" data-see="1"><span class="t">Je veux voir les votes des autres</span>'
    +'<span class="d">Leurs avis s\'affichent sous chaque maison, et les résultats du groupe en bas.</span></button>'
    +'<button type="button" class="'+(showOthers?'':'on')+'" data-see="0"><span class="t">Je préfère d\'abord réfléchir seul</span>'
    +'<span class="d">Tout est masqué jusqu\'à ce que tu changes d\'avis. Pour ne pas se laisser influencer.</span></button>'
    +'</div></div>';

  var v=myVotes(), done=HOUSES.filter(function(h){return v[h.id]}).length;

  s+='<div class="section-head"><span class="step">Étape 1</span><h2>Le tri</h2>'
    +'<span class="count">'+done+' / '+HOUSES.length+'</span></div>';
  s+='<p class="section-note">Pour chaque maison : <b>Oui !</b> si tu la verrais bien, <b>Bof</b> si elle ne te déplaît pas sans t\'emballer, <b>Non</b> si c\'est non. Pas besoin d\'y prendre des heures, un bon coup d\'instinct suffit.<br><span class="hint">Pour voir la maison, clique sur son nom.</span></p>';
  s+='<div class="houses">'+HOUSES.map(houseHTML).join('')+'</div>';

  s+='<div class="section-head"><span class="step">Étape 2</span><h2>Le classement</h2>'
    +'<span class="count">'+keptIds().length+' retenue'+(keptIds().length>1?'s':'')+'</span></div>';
  s+='<p class="section-note">Tes « Oui ! » et tes « Bof » remontent ici, les verts d\'abord. Range-les de ta préférée à la dernière.</p>';
  s+='<p class="rankhint">Attrape une ligne par les points à gauche pour la déplacer — ou sers-toi des flèches.</p>';
  s+='<div id="rankzone">'+rankHTML()+'</div>';

  s+='<div class="section-head"><span class="step">Étape 3</span><h2>Ton verdict</h2>'
    +'<span class="count" id="vcount"></span></div>';
  s+='<p class="section-note">La question la plus utile : est-ce que cette sélection te donne envie, ou est-ce qu\'il faut qu\'on cherche autre chose ?</p>';
  s+='<div id="verdictzone">'+verdictHTML()+'</div>';

  s+='<div class="section-head"><h2>Où en est le groupe</h2></div>';
  s+='<div id="reszone">'+resultsHTML()+'</div>';

  s+='<div class="savebar"><span class="status" id="status"></span>'
    +'<button type="button" class="ghost" id="copy">Voir mon récap</button>'
    +'<button type="button" class="primary" id="save">Enregistrer mon vote</button></div>';

  s+='<footer>Prix vérifiés aux dates exactes, taxes et frais de service compris. Temps de trajet calculés sur le réseau routier depuis Paris, Lyon et Toulouse. Les liens des titres ouvrent l\'annonce d\'origine.</footer>';

  s+='<dialog id="dlg"><h4>Ton récap</h4><p>Sélectionne le texte et copie-le si tu veux l\'envoyer à Pierre.</p>'

  s+='</div>';

}

/* ---------------- état ---------------- */
function ensureMe(){ if(!state.voters[me]) state.voters[me]={votes:{},rank:[],verdict:{}}; return state.voters[me]; }
function touch(){ dirty=true; setStatus(); persistLocal(); }
function persistLocal(){ try{ localStorage.setItem('vote-brouillon', JSON.stringify(state.voters[me]||{})); }catch(e){} }

function setStatus(msg){
  var el=document.getElementById('status'); if(!el) return;
  if(msg){ el.innerHTML=msg; return; }
  var v=myVotes(), done=HOUSES.filter(function(h){return v[h.id]}).length;
  var noVerdict = done>0 && !((myV().verdict||{}).v);
  el.innerHTML='<b>'+done+'</b> / '+HOUSES.length+' maisons triées'
    + (noVerdict ? ' · <b>avis global à donner</b>' : '')
    + (dirty ? ' — <b>pense à enregistrer</b>' : done? ' — enregistré' : '');
}

function recap(){
  var v=myVotes(), order=keptIds(), vd=myV().verdict||{};
  var L=['Vote de '+me+' — maison du 30/12 au 02/01',''];
  L.push('Mon classement :');
  if(order.length) order.forEach(function(id,i){ var h=byId(id); L.push('  '+(i+1)+'. '+h.name+' ('+h.commune+', '+h.price+') — '+(v[id]==='oui'?'Oui !':'Bof')); });
  else L.push('  (rien de retenu)');
  var nons=HOUSES.filter(function(h){return v[h.id]==='non'});
  if(nons.length){ L.push(''); L.push('Non : '+nons.map(function(h){return h.name}).join(', ')); }
  L.push('');
  L.push('Verdict : '+(vd.v==='hate'?"ça me donne hâte d'y être":vd.v==='bof'?"pas idéal":'(pas encore répondu)'));
  if(vd.v==='bof'&&(vd.reasons||[]).length) L.push('Ce qui cloche : '+vd.reasons.join(', '));
  if(vd.note&&vd.note.trim()) L.push('Note : '+vd.note.trim());
  return L.join('\n');
}

function repaint(zone){
  if(zone==='rank'||!zone){ var rz=document.getElementById('rankzone'); if(rz) rz.innerHTML=rankHTML(); }
  if(zone==='verdict'||!zone){ var vz=document.getElementById('verdictzone'); if(vz) vz.innerHTML=verdictHTML(); }
  if(zone==='res'||!zone){ var sz=document.getElementById('reszone'); if(sz) sz.innerHTML=resultsHTML(); }
  var cnt=document.querySelectorAll('.section-head .count');
  if(cnt[0]){ var v=myVotes(); cnt[0].textContent=HOUSES.filter(function(h){return v[h.id]}).length+' / '+HOUSES.length; }
  if(cnt[1]){ var k=keptIds().length; cnt[1].textContent=k+' retenue'+(k>1?'s':''); }
  var vc=document.getElementById('vcount');
  if(vc){ var got=!!((myV().verdict||{}).v);
    vc.textContent = got ? 'répondu' : 'à répondre';
    vc.className = 'count'+(got?'':' todo'); }
}

function full(){ document.getElementById('root').innerHTML=renderBody(); bind(); setStatus(); }

/* ---------------- interactions ---------------- */
function onClick(e){
  var t=e.target; if(!t||!t.closest) return;

  var see=t.closest('[data-see]');
  if(see){ showOthers=see.getAttribute('data-see')==='1';
    try{ localStorage.setItem('vote-voir',showOthers?'1':'0'); }catch(err){}
    full(); return; }

  var vb=t.closest('.vbtn');
  if(vb){
    var id=vb.getAttribute('data-h'), val=vb.getAttribute('data-v'), m=ensureMe();
    if(m.votes[id]===val) delete m.votes[id]; else m.votes[id]=val;
    touch();
    var art=document.getElementById('m-'+id);
    if(art){ var tmp=document.createElement('div'); tmp.innerHTML=houseHTML(byId(id));
      var fresh=tmp.firstElementChild; if(fresh) art.replaceWith(fresh); }
    repaint('rank'); repaint('res'); return;
  }

  var up=t.closest('[data-up]'), dn=t.closest('[data-down]');
  if(up||dn){
    var mid=(up||dn).getAttribute(up?'data-up':'data-down');
    var m2=ensureMe(), order=keptIds(), a=order.indexOf(mid), b=up?a-1:a+1;
    if(b>=0&&b<order.length){ var sw=order[a]; order[a]=order[b]; order[b]=sw; m2.rank=order; touch(); repaint('rank'); }
    return;
  }

  var vd=t.closest('[data-verdict]');
  if(vd){ var m3=ensureMe(); m3.verdict=m3.verdict||{};
    m3.verdict.v=vd.getAttribute('data-verdict');
    var vz=document.getElementById('verdictzone'); if(vz) vz.classList.remove('needs');
    touch(); repaint('verdict'); return; }

  var rb=t.closest('[data-reason]');
  if(rb){ var m4=ensureMe(); m4.verdict=m4.verdict||{}; m4.verdict.reasons=m4.verdict.reasons||[];
    var r=rb.getAttribute('data-reason'), k=m4.verdict.reasons.indexOf(r);
    if(k>-1) m4.verdict.reasons.splice(k,1); else m4.verdict.reasons.push(r);
    touch(); repaint('verdict'); return; }
}

function onInput(e){
  if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-note')){
    var m=ensureMe(); m.verdict=m.verdict||{}; m.verdict.note=e.target.value; touch();
  }
}

/* ---------------- glisser-déposer du classement ----------------
   Pointer Events plutôt que l'API drag-and-drop HTML5 : celle-ci ne marche
   pas au doigt, et la moitié des copains voteront depuis leur téléphone.
   La poignée porte touch-action:none pour que le geste ne scrolle pas la page ;
   le reste de la ligne reste attrapable à la souris. */
var drag=null;

function rankGap(rects){
  return rects.length>1 ? Math.max(0, rects[1].top-rects[0].bottom) : 8;
}

function dragStart(e){
  if(drag) return;
  if(e.button!==undefined && e.button!==0) return;
  var t=e.target; if(!t||!t.closest) return;
  if(t.closest('button')) return;
  var row=t.closest('.rankrow'); if(!row) return;
  var onGrip=!!t.closest('.grip');
  /* Au doigt, on n'attrape que par la poignée, sinon on bloque le défilement. */
  if(!onGrip && e.pointerType && e.pointerType!=='mouse') return;

  var zone=document.getElementById('rankzone'); if(!zone) return;
  var rows=[].slice.call(zone.querySelectorAll('.rankrow'));
  if(rows.length<2) return;
  var from=rows.indexOf(row); if(from<0) return;

  var v=myVotes(), order=keptIds(), grp=v[order[from]];
  var lo=from, hi=from;
  while(lo>0 && v[order[lo-1]]===grp) lo--;
  while(hi<order.length-1 && v[order[hi+1]]===grp) hi++;
  if(lo===hi) return;   /* seule de son groupe : rien à réordonner */

  drag={rows:rows, rects:rows.map(function(r){return r.getBoundingClientRect()}),
        row:row, from:from, to:from, lo:lo, hi:hi,
        startY:e.clientY, moved:false, pid:e.pointerId};
  try{ row.setPointerCapture(e.pointerId); }catch(err){}
}

function dragMove(e){
  var d=drag; if(!d || e.pointerId!==d.pid) return;
  var dy=e.clientY-d.startY;
  if(!d.moved){
    if(Math.abs(dy)<5) return;
    d.moved=true;
    d.row.classList.add('dragging');
    document.body.classList.add('dragging-rank');
  }
  if(e.cancelable) e.preventDefault();

  var mine=d.rects[d.from];
  var centre=mine.top+mine.height/2+dy;
  var to=0;
  for(var i=0;i<d.rects.length;i++){
    if(i===d.from) continue;
    if(centre > d.rects[i].top+d.rects[i].height/2) to++;
  }
  to=Math.max(d.lo, Math.min(d.hi, to));
  d.to=to;

  var step=mine.height+rankGap(d.rects);
  d.row.style.transform='translateY('+dy+'px)';
  d.rows.forEach(function(r,i){
    if(i===d.from) return;
    var shift=0;
    if(to>d.from && i>d.from && i<=to) shift=-step;
    else if(to<d.from && i>=to && i<d.from) shift=step;
    r.classList.add('shifted');
    r.style.transform = shift ? 'translateY('+shift+'px)' : '';
  });
}

function dragEnd(e){
  var d=drag; if(!d || (e && e.pointerId!==undefined && e.pointerId!==d.pid)) return;
  drag=null;
  try{ d.row.releasePointerCapture(d.pid); }catch(err){}
  d.rows.forEach(function(r){ r.style.transform=''; r.classList.remove('shifted','dragging'); });
  document.body.classList.remove('dragging-rank');
  if(!d.moved || d.to===d.from) return;
  var m=ensureMe(), order=keptIds();
  var id=order.splice(d.from,1)[0];
  order.splice(d.to,0,id);
  m.rank=order; touch(); repaint('rank');
}

function bind(){
  var root=document.getElementById('root');

  /* La délégation ne s'attache qu'une seule fois : sans ce garde, chaque
     re-rendu ajoutait un écouteur de plus et le clic comptait double. */
  if(!root.__bound){
    root.__bound=true;
    root.addEventListener('click',onClick);
    root.addEventListener('input',onInput);
    root.addEventListener('pointerdown',dragStart);
    window.addEventListener('pointermove',dragMove,{passive:false});
    window.addEventListener('pointerup',dragEnd);
    window.addEventListener('pointercancel',dragEnd);
    window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  }

  var go=document.getElementById('go');
  if(go){
    var inp=document.getElementById('nom');
    var start=function(){
      var n=(inp.value||'').trim().slice(0,24);
      if(!n){ inp.focus(); return; }
      me=n; if(showOthers===null) showOthers=false;
      try{ localStorage.setItem('vote-nom',me); localStorage.setItem('vote-voir',showOthers?'1':'0'); }catch(err){}
      ensureMe(); full();
    };
    go.addEventListener('click',start);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') start(); });
    return;
  }

  var sv=document.getElementById('save'); if(sv) sv.addEventListener('click',save);
  var cp=document.getElementById('copy');
  if(cp) cp.addEventListener('click',function(){
    var d=document.getElementById('dlg'), tx=document.getElementById('dlgtxt');
    tx.value=recap(); if(d.showModal) d.showModal(); else window.prompt('Copie :',tx.value);
    tx.focus(); tx.select();
  });
  var dc=document.getElementById('dlgclose');
  if(dc) dc.addEventListener('click',function(){ document.getElementById('dlg').close(); });
  var rn=document.getElementById('rename');
  if(rn) rn.addEventListener('click',function(){
    try{ localStorage.removeItem('vote-nom'); }catch(err){}
    me=null; full();
  });
}

function formBody(){
  var v=myVotes(), order=keptIds(), vd=myV().verdict||{};
  var compact=HOUSES.filter(function(h){return v[h.id]})
    .map(function(h){ return h.n+':'+h.name+'='+v[h.id]; }).join(' | ');
  var rank=order.map(function(id,i){ var h=byId(id); return (i+1)+'. '+h.name+' ('+(v[id]==='oui'?'Oui':'Bof')+')'; }).join(' | ');
  var verdict = vd.v==='hate'?"hâte d'y être":vd.v==='bof'?'pas idéal':'';
  var resume = [
    rank ? 'Classement : '+rank : '',
    verdict ? 'Verdict : '+verdict : '',
    (vd.reasons||[]).length ? 'Raisons : '+(vd.reasons||[]).join(', ') : '',
    vd.note ? 'Note : '+vd.note : ''
  ].filter(Boolean).join('\n');
  var p=new URLSearchParams();
  p.append(CFG.ENTRY.nom, me);
  p.append(CFG.ENTRY.votes, compact);
  p.append(CFG.ENTRY.resume, resume);
  return p;
}

/* Un votant a rempli les 17 maisons puis tapé « Enregistrer » depuis la barre
   collante sans jamais descendre jusqu'à l'étape 3 — et c'est la réponse la
   plus utile des trois. Le premier envoi sans avis global l'emmène donc à la
   question ; le deuxième part quand même, on ne bloque personne. */
var verdictNudged = false;

function flagVerdict(){
  var vz=document.getElementById('verdictzone'); if(!vz) return;
  vz.classList.add('needs');
  vz.scrollIntoView({behavior:'smooth',block:'center'});
  setStatus('Il manque <b>ton avis global</b> — la question la plus utile des trois, '
    +'juste au-dessus. Réponds-y, ou retape « Enregistrer » pour envoyer sans.');
}

function save(){
  var btn=document.getElementById('save');
  ensureMe(); persistLocal();

  if(!((myV().verdict||{}).v) && !verdictNudged){ verdictNudged=true; flagVerdict(); return; }

  if(!CFG.FORM_ACTION){
    dirty=false;
    setStatus('Gardé sur cet appareil — l\'envoi groupé n\'est pas encore branché');
    return;
  }
  btn.disabled=true; setStatus('Envoi…');
  /* Le formulaire Google n'autorise pas la lecture de sa réponse : on poste
     en aveugle, ce qui suffit — l'écriture aboutit. */
  fetch(CFG.FORM_ACTION,{method:'POST',mode:'no-cors',body:formBody()})
    .then(function(){
      dirty=false; btn.disabled=false;
      try{ localStorage.setItem('vote-envoye',String(Date.now())); }catch(e){}
      setStatus('<b>Envoyé.</b> Merci ' + esc(me) + ' — tu peux fermer, ou revenir modifier et renvoyer.'
        + (((myV().verdict||{}).v) ? '' : ' <b>Ton avis global reste vide</b> : réponds-y et renvoie, ça compte.'));
      loadOthers(true);
    },function(){
      btn.disabled=false;
      setStatus('L\'envoi a échoué. Ton vote est gardé sur cet appareil, réessaie dans un instant.');
    });
}

/* ---------------- lecture des votes du groupe ---------------- */
function parseCSV(text){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false; }
      else cur+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r'){ cur+=c; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){return x.trim()}) });
}

function loadOthers(force){
  if(!CFG.CSV || loadingOthers) return;
  loadingOthers=true; othersError=false;
  fetch(CFG.CSV+(force?('&_='+Date.now()):''))
    .then(function(r){ return r.text(); })
    .then(function(t){
      var rows=parseCSV(t); if(rows.length<2){ loadingOthers=false; return; }
      var head=rows[0].map(function(h){return h.toLowerCase()});
      var iNom=head.findIndex(function(h){return h.indexOf('prénom')>-1||h.indexOf('prenom')>-1});
      var iVotes=head.findIndex(function(h){return h.indexOf('vote')>-1});
      if(iNom<0||iVotes<0){ loadingOthers=false; return; }
      var fresh={};
      rows.slice(1).forEach(function(r){
        var nom=(r[iNom]||'').trim(); if(!nom) return;
        var votes={};
        (r[iVotes]||'').split('|').forEach(function(part){
          var m=part.split('=');
          if(m.length<2) return;
          var label=m[0].trim(), val=m[1].trim();
          /* Le libellé vaut « 12:Nom de la maison ». On retrouve la maison par
             son NOM d'abord : le numéro se décale dès qu'on retire une maison
             de la sélection, et les votes déjà envoyés deviendraient faux. */
          var nm=label.replace(/^\d+\s*:\s*/,'').trim();
          var h=HOUSES.filter(function(x){return x.name===nm})[0];
          if(!h){ var num=parseInt(label,10);
                  h=HOUSES.filter(function(x){return x.n===num})[0]; }
          if(h && ['oui','bof','non'].indexOf(val)>-1) votes[h.id]=val;
        });
        fresh[nom]={votes:votes};            /* la dernière ligne d'un même prénom l'emporte */
      });
      if(state.voters[me]) fresh[me]=state.voters[me];
      state.voters=fresh;
      loadingOthers=false;
      if(me){ repaint('res'); repaintOthers(); }
    })
    .catch(function(){ loadingOthers=false; othersError=true; });
}

function repaintOthers(){
  if(!showOthers) return;
  HOUSES.forEach(function(h){
    var art=document.getElementById('m-'+h.id); if(!art) return;
    var tmp=document.createElement('div'); tmp.innerHTML=houseHTML(h);
    var fresh=tmp.firstElementChild; if(fresh) art.replaceWith(fresh);
  });
}

/* ---------------- boot ---------------- */
if(me){
  ensureMe();
  try{
    var d=localStorage.getItem('vote-brouillon');
    if(d){
      var pd=JSON.parse(d), cur=state.voters[me]||{};
      var nLocal=Object.keys((pd&&pd.votes)||{}).length, nPub=Object.keys(cur.votes||{}).length;
      if(pd && nLocal>nPub) state.voters[me]=pd;
    }
  }catch(e){}
}
full();
loadOthers();

</script>
